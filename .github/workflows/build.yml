name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
                                  libncurses5-dev git clang lld libelf-dev make

      - name: Clone Proton Clang toolchain (recommended)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang-18

      - name: Build kernel
        run: |
          export PATH=$PWD/clang-18/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-

          # Load defconfig
          make ARCH=$ARCH O=out lavender_defconfig

          # Build with scoped LD to avoid glibc conflict
          make -j$(nproc) ARCH=$ARCH O=out \
            CC=$CC \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            LD=ld.lld

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: out/arch/arm64/boot/Image.gz-dtb

      - name: Upload RTL8821AU driver module
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RTL8821AU-Module
          path: out/drivers/net/wireless/rtl8821au/*.ko
