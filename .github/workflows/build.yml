name: Build Kernel

on:
  workflow_dispatch: # Manually trigger build from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev make libncurses5-dev gcc clang git

    - name: Clone Clang toolchain
      run: |
        git clone --depth=1 https://github.com/arter97/clang-18.git clang-18

    - name: Build kernel
      env:
        PATH: ${{ github.workspace }}/clang-18/bin:${PATH}
        ARCH: arm64
        SUBARCH: arm64
      run: |
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=clang
        make lavender_defconfig
        make -j$(nproc)

    - name: Upload kernel image
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Image
        path: arch/arm64/boot/Image.gz-dtb
