name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
                                  libncurses5-dev git clang lld libelf-dev make zip

      - name: Clone Proton Clang toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang-18

      - name: Build kernel + RTL8821AU
        run: |
          export CLANG_PATH=$PWD/clang-18/bin
          export PATH=$CLANG_PATH:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          rm -f $CLANG_PATH/ld || true

          # Load the defconfig
          make ARCH=$ARCH O=out lavender_defconfig

          # Disable broken GPU/DRM/graphics subsystems
          for cfg in DRM DRM_KMS_HELPER I915 DRM_AMD DRM_RCAR FB CFB_FILLRECT FRAMEBUFFER_CONSOLE; do
            scripts/config --file out/.config -d $cfg
          done

          # Disable virtualization to avoid ld errors
          scripts/config --file out/.config -d VIRT
          scripts/config --file out/.config -d VIRTIO

          # Disable audio and related systems
          for cfg in SOUND SND SND_SOC SND_USB_AUDIO; do
            scripts/config --file out/.config -d $cfg
          done

          # Disable kernel config blob and Kconfig targets
          for cfg in HSI IKCONFIG IKCONFIG_PROC KERNEL_CONFIG_DATA; do
            scripts/config --file out/.config -d $cfg
          done

          # Enable RTL8821AU and WiFi as kernel modules
          for cfg in RTL8821AU USB_SUPPORT WLAN CFG80211; do
            scripts/config --file out/.config -m $cfg
          done

          # Regenerate updated config
          make ARCH=$ARCH O=out olddefconfig

          # Build the kernel
          make -j$(nproc) ARCH=$ARCH O=out \
            CC=$CC \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            LD=ld.lld \
            CONFIG_KERNEL_CONFIG_DATA=n

      - name: Package with AnyKernel3
        run: |
          mkdir -p flashzip
          cp out/arch/arm64/boot/Image.gz-dtb flashzip/ || exit 1
          cp out/drivers/net/wireless/rtl8821au/*.ko flashzip/ || echo "No module found"
          cp -r .anykernel/* flashzip/ || echo "No AnyKernel3 template"
          echo "Kernel with RTL8821AU" > flashzip/README.txt
          cd flashzip && zip -r9 ../Kernel-flashable.zip *

      - name: Verify Kernel Package
        run: |
          ls -lh Kernel-flashable.zip || exit 1

      - name: Upload flashable ZIP (Actions Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Flashable-Kernel-Zip
          path: Kernel-flashable.zip

      - name: Upload to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: Kernel-flashable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
