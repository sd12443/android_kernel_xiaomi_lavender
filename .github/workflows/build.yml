name: Build Kernel and RTL8821AU Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: sd12443/android_kernel_xiaomi_lavender
          ref: master

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
                                  libncurses5-dev git clang lld libelf-dev make zip \
                                  python2 rsync

      - name: Clone Proton Clang toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang-18

      - name: Build kernel
        run: |
          export CLANG_PATH=$PWD/clang-18/bin
          export PATH=$CLANG_PATH:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KBUILD_BUILD_USER=github-actions
          export KBUILD_BUILD_HOST=github
          
          # Remove conflicting ld symlink if exists
          rm -f $CLANG_PATH/ld || true
          
          # Create out directory and load defconfig
          mkdir -p out
          make ARCH=$ARCH O=out lavender_defconfig
          
          # Build kernel
          make -j$(nproc --all) ARCH=$ARCH O=out \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Build RTL8821AU driver
        run: |
          export CLANG_PATH=$PWD/clang-18/bin
          export PATH=$CLANG_PATH:$PATH
          export ARCH=arm64
          export KERNEL_SRC=$PWD
          export KERNEL_PATH=$PWD/out
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Clone driver source
          git clone https://github.com/aircrack-ng/rtl8812au.git
          cd rtl8812au
          
          # Build driver
          make -j$(nproc --all) ARCH=$ARCH \
              KSRC=$KERNEL_SRC \
              KERNEL_DIR=$KERNEL_PATH \
              CROSS_COMPILE=$CROSS_COMPILE \
              CONFIG_RTL8812AU=m
          
          # Create Magisk module
          mkdir -p magisk_module/system/lib/modules
          cp 8812au.ko magisk_module/system/lib/modules/
          
          # Create module.prop
          echo "id=rtl8821au" > magisk_module/module.prop
          echo "name=RTL8821AU Driver" >> magisk_module/module.prop
          echo "version=v1.0" >> magisk_module/module.prop
          echo "versionCode=1" >> magisk_module/module.prop
          echo "author=GitHub Actions" >> magisk_module/module.prop
          echo "description=RTL8821AU WiFi driver module" >> magisk_module/module.prop
          
          # Package module
          cd magisk_module
          zip -r ../RTL8821AU-Magisk.zip *
          cd ../..

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: kernel-artifacts
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            RTL8821AU-Magisk.zip
