name: Build Kernel & RTL8821AU (Magisk)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex \
            libssl-dev libncurses5-dev git clang lld libelf-dev make zip

      - name: Clone Proton Clang
        run: git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang-18

      - name: Patch kernel Makefiles (remove broken subsystems)
        run: |
          sed -i '/^obj-y\s\+=\s\+virt/d' Makefile
          sed -i '/^obj-y\s\+=\s\+gpu/d' drivers/Makefile
          sed -i '/^obj-y\s\+=\s\+sound/d' drivers/Makefile

      - name: Build kernel only (no WiFi)
        run: |
          export CLANG_PATH=$PWD/clang-18/bin
          export PATH=$CLANG_PATH:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          rm -f $CLANG_PATH/ld || true

          make ARCH=$ARCH O=out lavender_defconfig

          for cfg in DRM DRM_KMS_HELPER I915 DRM_AMD DRM_RCAR FB \
                     CFB_FILLRECT FRAMEBUFFER_CONSOLE \
                     VIRT VIRTIO SOUND SND SND_SOC SND_USB_AUDIO \
                     HSI IKCONFIG IKCONFIG_PROC KERNEL_CONFIG_DATA \
                     MSM_KGSL MSM_KGSL_IOMMU RTL8821AU; do
            scripts/config --file out/.config -d $cfg
          done

          make ARCH=$ARCH O=out olddefconfig

          make -j$(nproc) ARCH=$ARCH O=out \
            CC=$CC \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            LD=ld.lld

      - name: Package Kernel (AnyKernel3)
        run: |
          mkdir -p flashzip
          cp out/arch/arm64/boot/Image.gz-dtb flashzip/ || exit 1
          cp -r .anykernel/* flashzip/
          echo "Minimal kernel (no built-in RTL8821AU)" > flashzip/README.txt
          cd flashzip && zip -r9 ../Kernel-Minimal.zip *

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Minimal-Kernel-Zip
          path: Kernel-Minimal.zip

      - name: Build RTL8821AU module separately
        run: |
          # Prepare environment
          export CLANG_PATH=$PWD/clang-18/bin
          export PATH=$CLANG_PATH:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang

          # Assume driver is in drivers/net/wireless/rtl8821au/
          make -C out M=$(pwd)/drivers/net/wireless/rtl8821au modules

      - name: Package Magisk module
        run: |
          mkdir -p magisk-module/system/lib/modules
          cp drivers/net/wireless/rtl8821au/*.ko magisk-module/system/lib/modules/

          cat <<EOF > magisk-module/module.prop
id=rtl8821au-driver
name=RTL8821AU USB WiFi
version=1.0
author=KernelBuilder
description=External WiFi driver for Realtek 8821AU (Magisk)
EOF

          echo "#!/system/bin/sh" > magisk-module/post-fs-data.sh
          chmod +x magisk-module/post-fs-data.sh

          cd magisk-module
          zip -r9 ../RTL8821AU-Magisk.zip *

      - name: Upload Magisk module
        uses: actions/upload-artifact@v4
        with:
          name: RTL8821AU-Magisk-Module
          path: RTL8821AU-Magisk.zip

      - name: Upload to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Kernel-Minimal.zip
            RTL8821AU-Magisk.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
