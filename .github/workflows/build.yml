name: Build RTL8821AU Magisk Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Kernel Headers
        uses: actions/checkout@v4
        with:
          repository: sd12443/android_kernel_xiaomi_lavender
          ref: master
          path: kernel-headers
          sparse-checkout: |
            include/
            arch/arm64/include/
            scripts/
            Makefile
            Module.symvers

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libssl-dev \
                                  git clang lld libelf-dev make zip \
                                  python2 python3 rsync wget

      - name: Download Prebuilt Clang
        run: |
          mkdir -p toolchain
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r450784d.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz -C toolchain
          rm clang.tar.gz
          echo "CLANG_PATH=$(pwd)/toolchain/bin" >> $GITHUB_ENV

      - name: Build RTL8821AU Driver
        run: |
          # Clone driver source
          git clone https://github.com/aircrack-ng/rtl8812au.git
          cd rtl8812au
          
          # Build against kernel headers
          make ARCH=arm64 \
               KSRC=$GITHUB_WORKSPACE/kernel-headers \
               CC=clang \
               LD=ld.lld \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CONFIG_RTL8812AU=m

      - name: Create Magisk Module
        run: |
          mkdir -p magisk-module/{system/lib/modules,META-INF/com/google/android}
          
          # Copy compiled driver
          cp rtl8812au/8812au.ko magisk-module/system/lib/modules/
          
          # Create module.prop
          cat > magisk-module/module.prop <<EOF
          id=rtl8821au
          name=RTL8821AU Driver
          version=v1.0
          versionCode=$(date +%Y%m%d)
          author=Auto-built
          description=Magisk module for RTL8821AU WiFi driver
          EOF
          
          # Create loading script
          cat > magisk-module/post-fs-data.sh <<EOF
          #!/system/bin/sh
          MODDIR=\${0%/*}
          insmod \$MODDIR/system/lib/modules/8812au.ko
          EOF
          chmod +x magisk-module/post-fs-data.sh
          
          # Create Magisk install scripts
          echo "#MAGISK" > magisk-module/META-INF/com/google/android/update-binary
          cat > magisk-module/META-INF/com/google/android/updater-script <<EOF
          ui_print("Installing RTL8821AU Driver");
          set_perm_recursive(\$MODPATH/system/lib/modules 0 0 0755 0644);
          EOF
          
          # Package module
          cd magisk-module
          zip -r9 ../RTL8821AU-Magisk.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTL8821AU-Magisk-Module
          path: RTL8821AU-Magisk.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: RTL8821AU-Magisk.zip
          tag_name: rtl8821au-$(date +%Y%m%d)
          name: RTL8821AU Driver $(date +%Y-%m-%d)
          body: |-
            Auto-built RTL8821AU Magisk Module
            Built on: $(date)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
