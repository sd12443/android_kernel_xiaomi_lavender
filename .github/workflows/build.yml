name: Build Kernel for Lavender

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v2

      - name: Set up GCC Toolchain (arm64)
        run: git clone --depth=1 https://github.com/arter97/arm64-gcc.git gcc64

      - name: Set up GCC Toolchain (arm32)
        run: git clone --depth=1 https://github.com/arter97/arm32-gcc.git gcc32

      - name: Build Kernel
        run: |
          export PATH=$PWD/gcc64/bin:$PWD/gcc32/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-eabi-
          ls -l $PWD/gcc64/bin/aarch64-linux-android-gcc
          ls -l $PWD/gcc32/bin/arm-eabi-gcc
          which aarch64-linux-android-gcc || echo "aarch64-linux-android-gcc not in PATH"
          which arm-eabi-gcc || echo "arm-eabi-gcc not in PATH"
          make ARCH=arm64 O=out lavender_defconfig
          make -j$(nproc) ARCH=arm64 O=out

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: out/arch/arm64/boot/Image.gz-dtb
