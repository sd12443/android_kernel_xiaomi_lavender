name: Build Kernel and RTL8821AU Magisk Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Attempt Git Checkout (Primary Method)
        id: git-checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: sd12443/android_kernel_xiaomi_lavender
          ref: master
          path: kernel-source
          fetch-depth: 1

      - name: Fallback - Download Source Archive
        if: steps.git-checkout.outcome == 'failure'
        run: |
          echo "Git checkout failed, trying archive download..."
          mkdir -p kernel-source
          cd kernel-source
          wget https://github.com/sd12443/android_kernel_xiaomi_lavender/archive/refs/heads/master.zip -O source.zip
          unzip source.zip
          mv android_kernel_xiaomi_lavender-master/* .
          rm -rf android_kernel_xiaomi_lavender-master source.zip
          echo "SOURCE_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Verify Source
        run: |
          if [ ! -f "kernel-source/Makefile" ]; then
            echo "::error::Kernel source verification failed!"
            exit 1
          fi
          echo "Kernel source verified successfully"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
                                  libncurses5-dev git clang lld libelf-dev make zip \
                                  python2 python3 rsync wget unzip

      - name: Setup Toolchain (Proton Clang)
        run: |
          mkdir -p toolchain
          cd toolchain
          if ! git clone --depth=1 https://github.com/kdrag0n/proton-clang.git; then
            echo "Git clone failed, using direct download..."
            wget https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.zip -O clang.zip
            unzip clang.zip
            mv proton-clang-master proton-clang
            rm clang.zip
          fi
          echo "TOOLCHAIN_PATH=$(pwd)/proton-clang/bin" >> $GITHUB_ENV

      - name: Build Kernel
        working-directory: ./kernel-source
        run: |
          export PATH=$TOOLCHAIN_PATH:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          mkdir -p out
          make O=out lavender_defconfig
          
          # Enable required modules
          ./scripts/config --file out/.config \
            -m RTL8821AU \
            -m CFG80211 \
            -m MAC80211 \
            -m USB_SUPPORT \
            -m USB
          
          make -j$(nproc --all) O=out || make O=out

      - name: Build RTL8821AU Driver
        run: |
          git clone https://github.com/aircrack-ng/rtl8812au.git
          cd rtl8812au
          make ARCH=arm64 \
               KSRC=$GITHUB_WORKSPACE/kernel-source \
               KERNEL_DIR=$GITHUB_WORKSPACE/kernel-source/out \
               CC=clang \
               LD=ld.lld \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CONFIG_RTL8812AU=m

      - name: Create Magisk Module
        run: |
          mkdir -p magisk-module/{system/lib/modules,META-INF/com/google/android}
          cp rtl8812au/8812au.ko magisk-module/system/lib/modules/
          
          cat > magisk-module/module.prop <<EOF
          id=rtl8821au
          name=RTL8821AU Driver
          version=v1.0
          versionCode=1
          author=GitHub Actions
          description=Magisk module for RTL8821AU WiFi driver
          EOF
          
          cat > magisk-module/post-fs-data.sh <<EOF
          #!/system/bin/sh
          MODDIR=\${0%/*}
          insmod \$MODDIR/system/lib/modules/8812au.ko
          EOF
          chmod +x magisk-module/post-fs-data.sh
          
          echo "#MAGISK" > magisk-module/META-INF/com/google/android/update-binary
          echo 'ui_print("Installing RTL8821AU Driver");' > magisk-module/META-INF/com/google/android/updater-script
          echo 'set_perm_recursive($MODPATH/system/lib/modules 0 0 0755 0644);' >> magisk-module/META-INF/com/google/android/updater-script
          
          cd magisk-module
          zip -r9 ../RTL8821AU-Magisk.zip *

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Build-Output
          path: |
            kernel-source/out/arch/arm64/boot/Image.gz-dtb
            RTL8821AU-Magisk.zip

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: RTL8821AU-Magisk.zip
          tag_name: rtl8821au-$(date +%Y%m%d-%H%M)
          name: RTL8821AU Driver $(date +%Y-%m-%d)
          body: |-
            Auto-built RTL8821AU Magisk Module
            Build date: $(date)
            Kernel commit: $(git -C kernel-source rev-parse --short HEAD)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
