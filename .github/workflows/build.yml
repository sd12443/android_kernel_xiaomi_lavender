name: Build Kernel and RTL8821AU Magisk Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: sd12443/android_kernel_xiaomi_lavender
          ref: master

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
                                  libncurses5-dev git clang lld libelf-dev make zip \
                                  python2 python3 rsync

      - name: Clone Proton Clang toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang-18

      - name: Build kernel
        run: |
          export CLANG_PATH=$PWD/clang-18/bin
          export PATH=$CLANG_PATH:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Clean and prepare
          rm -rf out
          mkdir -p out
          
          # Configure kernel
          make ARCH=$ARCH O=out lavender_defconfig
          scripts/config --file out/.config -m RTL8821AU -m CFG80211 -m MAC80211
          make ARCH=$ARCH O=out olddefconfig
          
          # Build kernel
          make -j$(nproc --all) ARCH=$ARCH O=out

      - name: Build RTL8821AU driver
        run: |
          export CLANG_PATH=$PWD/clang-18/bin
          export PATH=$CLANG_PATH:$PATH
          export ARCH=arm64
          export KERNEL_SRC=$PWD
          export KERNEL_PATH=$PWD/out
          
          # Clone driver source
          git clone https://github.com/aircrack-ng/rtl8812au.git
          cd rtl8812au
          
          # Build driver
          make -j$(nproc --all) ARCH=$ARCH \
              KSRC=$KERNEL_SRC \
              KERNEL_DIR=$KERNEL_PATH \
              CONFIG_RTL8812AU=m

      - name: Create Magisk Module
        run: |
          # Create module structure
          mkdir -p magisk_module/system/lib/modules
          cp rtl8812au/8812au.ko magisk_module/system/lib/modules/
          
          # Create module files
          cat > magisk_module/module.prop <<EOF
          id=rtl8821au
          name=RTL8821AU Driver
          version=v1.0
          versionCode=1
          author=GitHub Actions
          description=Magisk module for RTL8821AU WiFi driver
          EOF
          
          cat > magisk_module/post-fs-data.sh <<EOF
          #!/system/bin/sh
          MODDIR=\${0%/*}
          insmod \$MODDIR/system/lib/modules/8812au.ko
          EOF
          chmod +x magisk_module/post-fs-data.sh
          
          cat > magisk_module/service.sh <<EOF
          #!/system/bin/sh
          while [ "\$(getprop sys.boot_completed)" != "1" ]; do
              sleep 1
          done
          insmod \$MODDIR/system/lib/modules/8812au.ko
          EOF
          chmod +x magisk_module/service.sh
          
          # Create update-binary
          echo "#MAGISK" > magisk_module/META-INF/com/google/android/update-binary
          cat > magisk_module/META-INF/com/google/android/updater-script <<EOF
          ui_print("Installing RTL8821AU Driver");
          set_perm_recursive(\$MODPATH/system/lib/modules 0 0 0755 0644);
          EOF
          
          # Zip the module
          cd magisk_module
          zip -r9 ../RTL8821AU-Magisk.zip *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Build-Artifacts
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            RTL8821AU-Magisk.zip

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          files: |
            RTL8821AU-Magisk.zip
          tag_name: magisk-module-$(date +%Y%m%d)
          name: "RTL8821AU Magisk Module $(date +%Y-%m-%d)"
          body: |-
            Flashable Magisk module for RTL8821AU WiFi driver
            Built from kernel source: $(git rev-parse --short HEAD)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
