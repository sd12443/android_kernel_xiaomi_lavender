name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
                                  libncurses5-dev git clang lld libelf-dev make zip

      - name: Clone Proton Clang toolchain (recommended)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang-18

      - name: Build kernel + RTL8821AU
        run: |
          export CLANG_PATH=$PWD/clang-18/bin
          export PATH=$CLANG_PATH:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          rm -f $CLANG_PATH/ld || true

          # Load defconfig
          make ARCH=$ARCH O=out lavender_defconfig

          # 🔒 Disable graphic and GPU drivers (prevent ld.lld errors)
          scripts/config --file out/.config -d DRM
          scripts/config --file out/.config -d DRM_KMS_HELPER
          scripts/config --file out/.config -d I915
          scripts/config --file out/.config -d DRM_AMD
          scripts/config --file out/.config -d DRM_RCAR
          scripts/config --file out/.config -d FB
          scripts/config --file out/.config -d CFB_FILLRECT
          scripts/config --file out/.config -d FRAMEBUFFER_CONSOLE

          # Disable audio subsystems and other triggers
          scripts/config --file out/.config -d SOUND
          scripts/config --file out/.config -d SND
          scripts/config --file out/.config -d SND_SOC
          scripts/config --file out/.config -d SND_USB_AUDIO

          # Disable kernel config blob and associated targets
          scripts/config --file out/.config -d HSI
          scripts/config --file out/.config -d IKCONFIG
          scripts/config --file out/.config -d IKCONFIG_PROC
          scripts-config --file out/.config -d KERNEL_CONFIG_DATA

          # ✅ Build RTL8821AU and WiFi as modules
          scripts/config --file out/.config -m RTL8821AU
          scripts-config --file out/.config -m USB_SUPPORT
          scripts-config --file out/.config -m WLAN
          scripts-config --file out/.config -m CFG80211

          # Regenerate working config
          make ARCH=$ARCH O=out olddefconfig

          # Build kernel
          make -j$(nproc) ARCH=$ARCH O=out \
            CC=$CC \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            LD=ld.lld \
            CONFIG_KERNEL_CONFIG_DATA=n

      - name: Package with AnyKernel3
        run: |
          mkdir -p flashzip
          cp out/arch/arm64/boot/Image.gz-dtb flashzip/
          cp out/drivers/net/wireless/rtl8821au/*.ko flashzip/ || echo "No module found"
          cp -r .anykernel/* flashzip/ || echo "Template missing"
          echo "Kernel with RTL8821AU" > flashzip/README.txt
          cd flashzip && zip -r9 ../Kernel-flashable.zip *

      - name: Test ZIP exists
        run: |
          ls -lh Kernel-flashable.zip || (echo "ZIP missing" && exit 1)

      - name: Upload flashable zip to Actions
        uses: actions/upload-artifact@v4
        with:
          name: Flashable-Zip
          path: Kernel-flashable.zip

      - name: Upload to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Kernel-flashable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
