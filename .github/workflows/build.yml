name: Build Kernel for Lavender

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v2

      - name: Download aarch64-linux-gnu toolchain
        run: |
          wget https://releases.linaro.org/components/toolchain/binaries/latest-10/aarch64-linux-gnu/gcc-linaro-10.3.1-2021.07-x86_64_aarch64-linux-gnu.tar.xz
          tar -xf gcc-linaro-10.3.1-2021.07-x86_64_aarch64-linux-gnu.tar.xz
          mv gcc-linaro-10.3.1-2021.07-x86_64_aarch64-linux-gnu gcc64

      - name: Download arm-linux-gnueabi toolchain
        run: |
          wget https://releases.linaro.org/components/toolchain/binaries/latest-10/arm-linux-gnueabi/gcc-linaro-10.3.1-2021.07-x86_64_arm-linux-gnueabi.tar.xz
          tar -xf gcc-linaro-10.3.1-2021.07-x86_64_arm-linux-gnueabi.tar.xz
          mv gcc-linaro-10.3.1-2021.07-x86_64_arm-linux-gnueabi gcc32
          ln -s $PWD/gcc32/bin/arm-linux-gnueabi-gcc $PWD/gcc32/bin/arm-linux-androideabi-gcc
          ln -s $PWD/gcc32/bin/arm-linux-gnueabi-g++ $PWD/gcc32/bin/arm-linux-androideabi-g++
          ln -s $PWD/gcc32/bin/arm-linux-gnueabi-ar $PWD/gcc32/bin/arm-linux-androideabi-ar
          ln -s $PWD/gcc32/bin/arm-linux-gnueabi-ld $PWD/gcc32/bin/arm-linux-androideabi-ld

      - name: Build Kernel
        run: |
          export PATH=$PWD/gcc64/bin:$PWD/gcc32/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          ls $PWD/gcc64/bin/aarch64-linux-gnu-gcc
          ls $PWD/gcc32/bin/arm-linux-androideabi-gcc
          which aarch64-linux-gnu-gcc || echo "aarch64-linux-gnu-gcc not in PATH"
          which arm-linux-androideabi-gcc || echo "arm-linux-androideabi-gcc not in PATH"
          make ARCH=arm64 O=out lavender_defconfig
          make -j$(nproc) ARCH=arm64 O=out

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: out/arch/arm64/boot/Image.gz-dtb
