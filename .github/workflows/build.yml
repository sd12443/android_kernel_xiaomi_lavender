name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex \
            libssl-dev libncurses5-dev git clang lld libelf-dev make zip

      - name: Clone Proton Clang
        run: git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang-18

      - name: Patch kernel Makefiles
        run: |
          sed -i '/^obj-y\s\+=\s\+virt/d' Makefile
          sed -i '/^obj-y\s\+=\s\+gpu/d' drivers/Makefile
          sed -i '/^obj-y\s\+=\s\+sound/d' drivers/Makefile

      - name: Build Kernel + RTL8821AU
        run: |
          export CLANG_PATH=$PWD/clang-18/bin
          export PATH=$CLANG_PATH:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          rm -f $CLANG_PATH/ld || true
          make ARCH=$ARCH O=out lavender_defconfig
          for cfg in DRM DRM_KMS_HELPER I915 DRM_AMD DRM_RCAR FB \
                     CFB_FILLRECT FRAMEBUFFER_CONSOLE \
                     VIRT VIRTIO SOUND SND SND_SOC SND_USB_AUDIO \
                     HSI IKCONFIG IKCONFIG_PROC KERNEL_CONFIG_DATA \
                     MSM_KGSL MSM_KGSL_IOMMU; do
            scripts/config --file out/.config -d $cfg
          done
          for cfg in RTL8821AU USB_SUPPORT WLAN CFG80211; do
            scripts/config --file out/.config -m $cfg
          done
          make ARCH=$ARCH O=out olddefconfig
          make -j$(nproc) ARCH=$ARCH O=out \
            CC=$CC \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            LD=ld.lld

      - name: Package Kernel Image (AnyKernel3 ZIP)
        run: |
          mkdir -p flashzip
          cp out/arch/arm64/boot/Image.gz-dtb flashzip/
          cp -r .anykernel/* flashzip/
          echo "Vanilla kernel (no extra modules)" > flashzip/README.txt
          cd flashzip && zip -r9 ../Kernel-Only.zip *

      - name: Package RTL8821AU as Magisk Module
        run: |
          mkdir -p magisk-module/system/lib/modules
          cp out/drivers/net/wireless/rtl8821au/*.ko magisk-module/system/lib/modules/ || true
          echo "RTL8821AU Magisk module" > magisk-module/README.md
          cat <<EOF > magisk-module/module.prop
id=rtl8821au
name=RTL8821AU WiFi Module
version=1.0
author=GitHub Actions
description=Injects rtl8821au.ko into system
EOF
          cat <<'EOL' > magisk-module/install.sh
#!/system/bin/sh
MODDIR=${0%/*}
mkdir -p /data/rtl8821au
cp $MODDIR/system/lib/modules/*.ko /data/rtl8821au/
chmod 644 /data/rtl8821au/*.ko
EOL
          chmod +x magisk-module/install.sh
          cd magisk-module && zip -r9 ../RTL8821AU-Magisk.zip *

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Only
          path: Kernel-Only.zip

      - name: Upload Magisk Module
        uses: actions/upload-artifact@v4
        with:
          name: RTL8821AU-Magisk
          path: RTL8821AU-Magisk.zip

      - name: Upload RTL8821AU Kernel Module (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: rtl8821au-ko
          path: out/drivers/net/wireless/rtl8821au/*.ko

      - name: Upload to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Kernel-Only.zip
            RTL8821AU-Magisk.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
