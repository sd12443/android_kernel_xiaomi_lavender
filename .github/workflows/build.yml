name: Build RTL8821AU Magisk Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Kernel Headers
        uses: actions/checkout@v4
        with:
          repository: sd12443/android_kernel_xiaomi_lavender
          ref: master
          path: kernel-headers
          sparse-checkout: |
            include/
            arch/arm64/include/
            scripts/
            Makefile
            .config

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libssl-dev \
                                  git clang lld libelf-dev make zip \
                                  wget flex bison

      - name: Setup Proton Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain
          echo "CLANG_PATH=$(pwd)/toolchain/bin" >> $GITHUB_ENV
          echo "PATH=$(pwd)/toolchain/bin:$PATH" >> $GITHUB_ENV

      - name: Prepare Kernel Headers
        working-directory: ./kernel-headers
        run: |
          # Create minimal .config if missing
          if [ ! -f ".config" ]; then
            echo "CONFIG_MODULES=y" > .config
            echo "CONFIG_RTL8821AU=m" >> .config
          fi
          
          # Generate headers
          make ARCH=arm64 scripts prepare

      - name: Build RTL8821AU Driver
        run: |
          git clone https://github.com/aircrack-ng/rtl8812au.git
          cd rtl8812au
          
          # Patch Makefile for Android kernel build
          sed -i 's/^CONFIG_PLATFORM_I386_PC =.*/CONFIG_PLATFORM_I386_PC = n/' Makefile
          sed -i 's/^CONFIG_PLATFORM_ARM64 =.*/CONFIG_PLATFORM_ARM64 = y/' Makefile
          sed -i 's/-DCONFIG_.*_PLATFORM//' Makefile
          
          # Build with proper kernel headers
          make ARCH=arm64 \
               KSRC=../kernel-headers \
               KERNEL_DIR=../kernel-headers \
               CC=clang \
               LD=ld.lld \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CONFIG_RTL8812AU=m

      - name: Create Magisk Module
        run: |
          mkdir -p magisk-module/{system/lib/modules,META-INF/com/google/android}
          
          # Verify driver exists
          if [ ! -f "rtl8812au/8812au.ko" ]; then
            echo "::error::Driver compilation failed!"
            exit 1
          fi
          
          cp rtl8812au/8812au.ko magisk-module/system/lib/modules/
          
          # Create module files
          cat > magisk-module/module.prop <<EOF
          id=rtl8821au
          name=RTL8821AU WiFi Driver
          version=v1.0
          versionCode=$(date +%Y%m%d)
          author=GitHub Actions
          description=Magisk module for RTL8821AU driver
          EOF
          
          cat > magisk-module/post-fs-data.sh <<EOF
          #!/system/bin/sh
          MODDIR=\${0%/*}
          insmod \$MODDIR/system/lib/modules/8812au.ko
          EOF
          chmod +x magisk-module/post-fs-data.sh
          
          # Create update scripts
          echo "#MAGISK" > magisk-module/META-INF/com/google/android/update-binary
          cat > magisk-module/META-INF/com/google/android/updater-script <<EOF
          ui_print("Installing RTL8821AU Driver");
          set_perm_recursive(\$MODPATH/system/lib/modules 0 0 0755 0644);
          EOF
          
          # Package module
          cd magisk-module
          zip -r9 ../RTL8821AU-Magisk.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTL8821AU-Magisk-Module
          path: RTL8821AU-Magisk.zip

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: RTL8821AU-Magisk.zip
          tag_name: rtl8821au-$(date +%Y%m%d)
          name: RTL8821AU Driver $(date +%Y-%m-%d)
          body: |
            Flashable Magisk module for RTL8821AU WiFi driver
            Built with Proton Clang toolchain
            Build date: $(date)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
