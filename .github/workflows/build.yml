name: Build Kernel for Lavender

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v2

      - name: Set up GCC Toolchain
        run: |
          git clone --depth=1 https://github.com/arter97/arm64-gcc.git gcc64
          export PATH=$PWD/gcc64/bin:$PATH

      - name: Build Kernel
        run: |
          export PATH=$PWD/gcc64/bin:$PATH
          make ARCH=arm64 O=out lavender_defconfig
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out modules
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-out
          path: |
            out/arch/arm64/boot/
