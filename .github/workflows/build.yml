name: Build Kernel for Lavender

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v2

      - name: Clone GCC Toolchains
        run: |
          git clone --depth=1 https://github.com/arter97/arm64-gcc.git gcc64
          git clone --depth=1 https://github.com/arter97/arm32-gcc.git gcc32

      - name: Build Kernel
        run: |
          export PATH=$PWD/gcc64/bin:$PWD/gcc32/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          
          which aarch64-linux-gnu-gcc || echo "64-bit GCC not found"
          which arm-linux-androideabi-gcc || echo "32-bit GCC not found"

          make ARCH=arm64 O=out lavender_defconfig
          make -j$(nproc) ARCH=arm64 O=out \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: out/arch/arm64/boot/Image.gz-dtb
