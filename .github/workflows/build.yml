name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
                                  libncurses5-dev git clang lld libelf-dev make zip

      - name: Clone Proton Clang toolchain (recommended)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang-18

      - name: Build kernel + RTL8821AU
        run: |
          export CLANG_PATH=$PWD/clang-18/bin
          export PATH=$CLANG_PATH:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          rm -f $CLANG_PATH/ld || true

          # Load correct defconfig
          make ARCH=$ARCH O=out lavender_defconfig

          # ✅ Disable config that causes defconfig error
          scripts/config --file out/.config -d KERNEL_CONFIG_DATA

          # Disable broken/unwanted subsystems
          scripts/config --file out/.config -d DRM
          scripts/config --file out/.config -d DRM_KMS_HELPER
          scripts/config --file out/.config -d FB
          scripts/config --file out/.config -d SOUND
          scripts/config --file out/.config -d SND
          scripts/config --file out/.config -d SND_SOC
          scripts/config --file out/.config -d SND_USB_AUDIO
          scripts/config --file out/.config -d FRAMEBUFFER_CONSOLE
          scripts/config --file out/.config -d HSI

          # Ensure RTL8821AU + USB is modular
          scripts/config --file out/.config -m RTL8821AU
          scripts/config --file out/.config -m USB_SUPPORT
          scripts/config --file out/.config -m WLAN
          scripts/config --file out/.config -m CFG80211

          # Apply updated config
          make ARCH=$ARCH O=out olddefconfig

          # Build kernel
          make -j$(nproc) ARCH=$ARCH O=out \
            CC=$CC \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            LD=ld.lld

      - name: Package with AnyKernel3
        run: |
          mkdir -p flashzip
          cp out/arch/arm64/boot/Image.gz-dtb flashzip/ || echo "Image not found"
          cp out/drivers/net/wireless/rtl8821au/*.ko flashzip/ || echo "Module not found"
          cp -r .anykernel/* flashzip/ || echo "Anykernel folder missing"
          echo "Custom kernel with RTL8821AU" > flashzip/README.txt
          cd flashzip && zip -r9 ../Kernel-flashable.zip *

      - name: "Debug: List contents before upload"

        run: |
          ls -lh Kernel-flashable.zip || echo "ZIP not created"

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: Flashable-Zip
          path: Kernel-flashable.zip

      - name: Upload to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Kernel-flashable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
