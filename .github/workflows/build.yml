name: Build RTL8821AU Magisk Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Attempt Repository Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: sd12443/android_kernel_xiaomi_lavender
          ref: master
          path: kernel-headers
          sparse-checkout: |
            include/
            arch/arm64/include/
            scripts/
            Makefile

      - name: Fallback - Download Kernel Headers
        if: steps.checkout.outcome == 'failure'
        run: |
          echo "Git checkout failed, downloading essential headers..."
          mkdir -p kernel-headers/include/linux kernel-headers/arch/arm64/include/asm
          
          # Download minimal required headers
          wget https://raw.githubusercontent.com/sd12443/android_kernel_xiaomi_lavender/master/include/linux/module.h -P kernel-headers/include/linux/
          wget https://raw.githubusercontent.com/sd12443/android_kernel_xiaomi_lavender/master/include/linux/kernel.h -P kernel-headers/include/linux/
          wget https://raw.githubusercontent.com/sd12443/android_kernel_xiaomi_lavender/master/arch/arm64/include/asm/barrier.h -P kernel-headers/arch/arm64/include/asm/
          wget https://raw.githubusercontent.com/sd12443/android_kernel_xiaomi_lavender/master/Makefile -P kernel-headers/
          
          # Create placeholder files
          touch kernel-headers/include/linux/compiler_types.h
          touch kernel-headers/include/linux/compiler-gcc.h
          touch kernel-headers/include/linux/types.h

      - name: Verify Kernel Headers
        run: |
          if [ ! -f "kernel-headers/include/linux/module.h" ]; then
            echo "::error::Essential kernel headers missing!"
            exit 1
          fi
          echo "Kernel headers verified"

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libssl-dev \
                                  git clang lld libelf-dev make zip \
                                  wget

      - name: Setup Proton Clang Toolchain
        run: |
          # Clone Proton Clang with retry
          for i in {1..3}; do
            git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain && break || sleep 10
          done
          
          if [ ! -d "toolchain/bin" ]; then
            echo "::error::Toolchain setup failed!"
            exit 1
          fi
          
          echo "CLANG_PATH=$(pwd)/toolchain/bin" >> $GITHUB_ENV
          echo "PATH=$(pwd)/toolchain/bin:$PATH" >> $GITHUB_ENV

      - name: Build RTL8821AU Driver
        run: |
          # Clone driver with retry
          for i in {1..3}; do
            git clone https://github.com/aircrack-ng/rtl8812au.git && break || sleep 10
          done
          
          cd rtl8812au
          
          # Patch Makefile for header-only build
          sed -i 's|^KERNEL_SRC =.*|KERNEL_SRC = $(shell pwd)/../kernel-headers|' Makefile
          sed -i 's|^KERNEL_BUILD =.*|KERNEL_BUILD = $(KERNEL_SRC)|' Makefile
          
          make ARCH=arm64 \
               CC=clang \
               LD=ld.lld \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CONFIG_RTL8812AU=m

      - name: Create Magisk Module
        run: |
          mkdir -p magisk-module/{system/lib/modules,META-INF/com/google/android}
          
          # Verify driver exists
          if [ ! -f "rtl8812au/8812au.ko" ]; then
            echo "::error::Driver compilation failed - no output file!"
            exit 1
          fi
          
          cp rtl8812au/8812au.ko magisk-module/system/lib/modules/
          
          # Create module files
          cat > magisk-module/module.prop <<EOF
          id=rtl8821au
          name=RTL8821AU WiFi Driver
          version=v1.0
          versionCode=$(date +%Y%m%d)
          author=GitHub Actions
          description=Magisk module for RTL8821AU driver
          EOF
          
          cat > magisk-module/post-fs-data.sh <<EOF
          #!/system/bin/sh
          MODDIR=\${0%/*}
          insmod \$MODDIR/system/lib/modules/8812au.ko
          EOF
          chmod +x magisk-module/post-fs-data.sh
          
          # Create update scripts
          echo "#MAGISK" > magisk-module/META-INF/com/google/android/update-binary
          cat > magisk-module/META-INF/com/google/android/updater-script <<EOF
          ui_print("Installing RTL8821AU Driver");
          set_perm_recursive(\$MODPATH/system/lib/modules 0 0 0755 0644);
          EOF
          
          # Package module
          cd magisk-module
          zip -r9 ../RTL8821AU-Magisk.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTL8821AU-Magisk-Module
          path: RTL8821AU-Magisk.zip

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: RTL8821AU-Magisk.zip
          tag_name: rtl8821au-$(date +%Y%m%d)
          name: RTL8821AU Driver $(date +%Y-%m-%d)
          body: |
            Flashable Magisk module for RTL8821AU WiFi driver
            Built with Proton Clang toolchain
            Build date: $(date)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
